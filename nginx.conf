server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The models are 115MB and immutable — Vite hashes the bundle, and the assets
  # under public/ are replaced by name when they change at all.
  location ~* \.(fbx|hdr|png|jpg|jpeg|webp)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  # FBX and HDR are already dense; gzipping them costs CPU and saves little.
  gzip_min_length 1024;
}
